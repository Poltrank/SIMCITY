<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="glassLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glassRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Icon Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Isometric Base Tile -->
  <g transform="translate(256, 310)" filter="url(#shadow)">
    <!-- Base Ground Slab -->
    <path d="M 0,-60 L 160,20 L 0,100 L -160,20 Z" fill="#22c55e" />
    <path d="M -160,20 L 0,100 L 0,125 L -160,45 Z" fill="#15803d" />
    <path d="M 0,100 L 160,20 L 160,45 L 0,125 Z" fill="#166534" />

    <!-- Road Arc -->
    <path d="M -120,40 L -40,80 L 0,100 L -40,80 Z" stroke="#475569" stroke-width="18" fill="none" stroke-linejoin="round" />
    <path d="M -120,40 L -40,80 L 0,100" stroke="#facc15" stroke-width="3" stroke-dasharray="6,6" fill="none" />

    <!-- Left Building (Residential/Commercial Glass Tower) -->
    <g transform="translate(-50, -40)">
      <!-- Left face -->
      <path d="M 0,0 L -40,-20 L -40,-130 L 0,-110 Z" fill="url(#glassLeft)" />
      <!-- Right face -->
      <path d="M 0,0 L 40,-20 L 40,-130 L 0,-110 Z" fill="url(#glassRight)" />
      <!-- Roof -->
      <path d="M 0,-110 L -40,-130 L 0,-150 L 40,-130 Z" fill="#34d399" />
      <!-- Windows glow -->
      <line x1="-20" y1="-30" x2="-20" y2="-110" stroke="#fef08a" stroke-width="4" stroke-dasharray="8,6" opacity="0.8" />
      <line x1="20" y1="-30" x2="20" y2="-110" stroke="#fef08a" stroke-width="4" stroke-dasharray="8,6" opacity="0.8" />
    </g>

    <!-- Main Skyscraper (Center) -->
    <g transform="translate(30, -20)">
      <!-- Left Face -->
      <path d="M 0,0 L -50,-25 L -50,-180 L 0,-155 Z" fill="url(#leftFace)" />
      <!-- Right Face -->
      <path d="M 0,0 L 50,-25 L 50,-180 L 0,-155 Z" fill="url(#rightFace)" />
      <!-- Roof Face -->
      <path d="M 0,-155 L -50,-180 L 0,-205 L 50,-180 Z" fill="url(#roofGrad)" />
      <!-- Spire / Antenna -->
      <line x1="0" y1="-205" x2="0" y2="-245" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
      <circle cx="0" cy="-245" r="5" fill="#ef4444" />

      <!-- Windows grid -->
      <line x1="-35" y1="-45" x2="-35" y2="-160" stroke="#bae6fd" stroke-width="4" stroke-dasharray="10,6" opacity="0.9" />
      <line x1="-18" y1="-35" x2="-18" y2="-150" stroke="#bae6fd" stroke-width="4" stroke-dasharray="10,6" opacity="0.9" />
      <line x1="18" y1="-35" x2="18" y2="-150" stroke="#7dd3fc" stroke-width="4" stroke-dasharray="10,6" opacity="0.8" />
      <line x1="35" y1="-45" x2="35" y2="-160" stroke="#7dd3fc" stroke-width="4" stroke-dasharray="10,6" opacity="0.8" />
    </g>

    <!-- Little Pine Trees & Fountain -->
    <circle cx="100" cy="10" r="10" fill="#0284c7" />
    <circle cx="100" cy="10" r="5" fill="#38bdf8" />
    <!-- Tree 1 -->
    <path d="M 80, -20 L 70, 0 L 90, 0 Z" fill="#15803d" />
    <path d="M 80, -32 L 72, -15 L 88, -15 Z" fill="#16a34a" />
    <rect x="78" y="0" width="4" height="6" fill="#78350f" />
    <!-- Tree 2 -->
    <path d="M -100, -10 L -108, 6 L -92, 6 Z" fill="#15803d" />
    <path d="M -100, -20 L -106, -7 L -94, -7 Z" fill="#22c55e" />
    <rect x="-102" y="6" width="4" height="5" fill="#78350f" />
  </g>
</svg>
